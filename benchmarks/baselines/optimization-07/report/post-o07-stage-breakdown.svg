<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="610" viewBox="0 0 1100 610">
  <rect width="1100" height="610" fill="#ffffff"/>
  <style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#17202a}.label{font-size:14px}.value{font-size:13px;font-weight:600}</style>
  <text x="40" y="38" font-size="24" font-weight="700">OPTIMIZATION-07 — post-optimization bottleneck ranking</text>
  <text x="40" y="64" font-size="14" fill="#636e72">Median stage times at 4 proof workers; FLINT and native proof overlap and must not be summed.</text>
  <g transform="translate(0 85)">
    <text x="40" y="30" class="label">Independent FLINT verification</text><rect x="285" y="12" width="720" height="26" fill="#d63031"/><text x="1015" y="31" class="value">1,884.216 ms</text>
    <text x="40" y="78" class="label">Native Proth proof</text><rect x="285" y="60" width="591" height="26" fill="#e17055"/><text x="886" y="79" class="value">1,546.061 ms</text>
    <text x="40" y="126" class="label">Result I/O / finalization</text><rect x="285" y="108" width="153" height="26" fill="#6c5ce7"/><text x="448" y="127" class="value">401.114 ms</text>
    <text x="40" y="174" class="label">Checkpoint</text><rect x="285" y="156" width="53" height="26" fill="#a29bfe"/><text x="348" y="175" class="value">139.004 ms</text>
    <text x="40" y="222" class="label">CPU sieve</text><rect x="285" y="204" width="33" height="26" fill="#00b894"/><text x="328" y="223" class="value">86.463 ms</text>
    <text x="40" y="270" class="label">Congruence compiler</text><rect x="285" y="252" width="18" height="26" fill="#55efc4"/><text x="313" y="271" class="value">47.772 ms</text>
    <text x="40" y="318" class="label">Candidate packing</text><rect x="285" y="300" width="3" height="26" fill="#0984e3"/><text x="298" y="319" class="value">7.703 ms</text>
    <text x="40" y="366" class="label">CUDA H2D + kernel + D2H</text><rect x="285" y="348" width="1" height="26" fill="#74b9ff"/><text x="296" y="367" class="value">0.634 ms</text>
  </g>
  <rect x="40" y="500" width="1020" height="68" rx="8" fill="#f1f2f6"/>
  <text x="60" y="528" font-size="15" font-weight="700">Next measured target: bounded parallel FLINT verification.</text>
  <text x="60" y="552" font-size="14">The CUDA PRP path is only ~0.021% of wall time here; more GPU micro-tuning cannot materially improve this workload yet.</text>
  <text x="40" y="595" font-size="12" fill="#636e72">Source: proof-workers/post-o07-stage-summary.csv and profiles/post-w4_nvtx_pushpop_sum.csv.</text>
</svg>
